<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <meta name="description" content="${description}">
  <meta name="theme-color" content="#C8102E">
  <meta property="og:title" content="${title}">
  <meta property="og:description" content="${description}">
  <meta property="og:type" content="website">
  <link rel="icon" href="${root}assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="${root}assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Saltar para o conteúdo</a>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="${root}index.html">
        <img src="${root}assets/images/logo.svg" alt="" width="40" height="40">
        <span>Kambas<br>do Java</span>
      </a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
      <nav id="nav" aria-label="Principal">
        <a href="${root}index.html"${nav_home}>Início</a>
        <a href="${root}all-posts.html"${nav_posts}>Artigos</a>
        <a href="${root}all-events.html"${nav_events}>Eventos</a>
        <a href="${root}all-members.html"${nav_members}>Membros</a>
        <a class="join" href="https://discord.gg/F9Q4f2gkHe" target="_blank" rel="noopener">Entrar no Discord</a>
      </nav>
    </div>
    <div class="livery" aria-hidden="true"></div>
  </header>

  <main id="main">
${content}
  </main>

  <footer class="foot">
    <div class="livery" aria-hidden="true"></div>
    <div class="wrap foot-in">
      <div>
        <p class="foot-name">Kambas do Java</p>
        <p>JUG Luanda. Programadores Java de Angola, a aprender em conjunto.</p>
      </div>
      <ul class="foot-links">
        <li><a href="https://www.youtube.com/@KambasdoJava" target="_blank" rel="noopener">YouTube</a></li>
        <li><a href="https://www.linkedin.com/company/kambas-do-java/" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://discord.gg/F9Q4f2gkHe" target="_blank" rel="noopener">Discord</a></li>
        <li><a href="https://github.com/kambas-do-java" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <p class="foot-small">© ${year} Kambas do Java · Feito em Luanda</p>
    </div>
  </footer>
  <script src="${root}assets/js/main.js" defer></script>
</body>
</html>
